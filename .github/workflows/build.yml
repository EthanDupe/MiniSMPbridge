name: Build MiniSMPBridge

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build shaded plugin JAR
        run: mvn -B clean package

      - name: Upload MiniSMPBridge-1.0.0.jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniSMPBridge-1.0.0
          path: target/MiniSMPBridge-1.0.0.jar
          if-no-files-found: error
